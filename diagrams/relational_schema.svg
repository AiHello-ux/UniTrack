    <path d="M 15 48 L 45 48" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="55" y="52" fill="#8b949e" font-size="11">Foreign Key Referential Arrow (Points to Referenced PK)</text>
  </g>

