    <text x="32" y="26" fill="#f0f6fc" font-size="12" font-weight="600">PK (Primary Key)</text>
    <circle cx="150" cy="22" r="5" fill="#58a6ff"/>
    <text x="162" y="26" fill="#f0f6fc" font-size="12" font-weight="600">FK (Foreign Key)</text>
    <circle cx="270" cy="22" r="5" fill="#3fb950"/>
