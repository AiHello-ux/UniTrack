<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 1020" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
