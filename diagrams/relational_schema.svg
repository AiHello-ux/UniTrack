    <line x1="16" y1="63" x2="115" y2="63" stroke="#e3b341" stroke-width="1"/>
    <text x="16" y="85" fill="#c9d1d9" font-size="12">name</text>
    <text x="180" y="85" fill="#8b949e" font-size="11">VARCHAR</text>
