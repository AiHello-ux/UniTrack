  <!-- Title & Metadata -->
  <text x="50" y="55" fill="#f0f6fc" font-size="24" font-weight="700">UniTrack — Relational Schema Architecture (Stage 4 Logical Blueprint)</text>
  <text x="50" y="82" fill="#8b949e" font-size="14">Third Normal Form (3NF) Relational Mapping • 11 Tables • 14 Foreign Key Constraints • Evaluated for Melvin Jacob (AU25UG-034)</text>

