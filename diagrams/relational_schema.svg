  <!-- Footnote -->
  <text x="50" y="990" fill="#8b949e" font-size="12">Legend Notes: Solid blue arrows denote standard hierarchical FK dependencies. Purple dashed arrow denotes the circular HOD link resolved via deferred ALTER TABLE. Orange dashed line denotes cross-module student submission attribution.</text>
